# codecov.yml
codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  status:
    project:
      frontend:
        target: 66%           # Target coverage percentage
        threshold: 0%         # Allow coverage to drop by this amount (0% means no drop allowed)
        base: auto            # Compare against base branch
        flags:
          - frontend          # Apply to frontend flags
        paths:
          - "frontend/src"    # Only check frontend source files
        if_ci_failed: error   # If CI fails, mark as error

      backend:
        target: 73%
        threshold: 0%
        base: auto
        flags:
          - backend
        paths:
          - "backend/src"
        if_ci_failed: error

    patch:
      default:
        target: 67%           # New code should have at least 67% coverage
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

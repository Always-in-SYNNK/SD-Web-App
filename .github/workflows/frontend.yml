name: Frontend CI

on:
    push:
        branches: [main, develop]
    pull_request    :
        branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test